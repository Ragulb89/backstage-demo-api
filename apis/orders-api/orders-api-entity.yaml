apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: orders-api
  title: Orders REST API
  description: Example REST API with GET and POST endpoints
spec:
  type: openapi
  lifecycle: experimental
  owner: team-a
  definition: |
    openapi: 3.0.3
    info:
      title: Orders API
      version: 1.0.0
      description: Simple Orders API with GET and POST
    paths:
      /orders:
        get:
          summary: List orders
          responses:
            '200':
              description: OK
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        post:
          summary: Create order
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/NewOrder'
          responses:
            '201':
              description: Created
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Order'
      /orders/{orderId}:
        get:
          summary: Get order by ID
          parameters:
            - name: orderId
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: OK
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Order'
            '404':
              description: Not Found
    components:
      schemas:
        Order:
          type: object
          properties:
            id: { type: string, example: "ORD-1001" }
            product: { type: string, example: "Laptop" }
            quantity: { type: integer, example: 1 }
            status: { type: string, example: "CREATED" }
        NewOrder:
          type: object
          required: [product, quantity]
          properties:
            product: { type: string, example: "Laptop" }
            quantity: { type: integer, example: 1 }
