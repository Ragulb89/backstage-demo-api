openapi: 3.0.3
info:
  title: Orders API
  description: Simple Orders API with GET and POST for Backstage testing
  version: 1.0.0

servers:
  - url: https://api.example.com

paths:
  /orders:
    get:
      summary: List orders
      description: Returns a list of orders
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

    post:
      summary: Create order
      description: Creates a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}:
    get:
      summary: Get order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          example: "ORD-1001"
        product:
          type: string
          example: "Laptop"
        quantity:
          type: integer
          example: 1
        status:
          type: string
          example: CREATED

    NewOrder:
      type: object
      required:
        - product
        - quantity
      properties:
        product:
          type: string
          example: "Laptop"
        quantity:
          type: integer
          example: 1
